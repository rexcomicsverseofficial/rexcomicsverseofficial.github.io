name: Build Android APK

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets not set - signing with a throwaway key. Installed apps will NOT update from this APK once you add your real key."
            PW=$(openssl rand -hex 16)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias rexcomics \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" \
              -dname "CN=Rex Comicsverse, O=Rex Comicsverse, C=IN"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=rexcomics" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/rex-comicsverse.apk"

      - name: Write assetlinks.json for this signing key
        run: |
          FP=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias rexcomics | grep 'SHA256:' | awk '{print $2}')
          cat > "$RUNNER_TEMP/assetlinks.json" <<JSON
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.rexcomicsverse.app",
              "sha256_cert_fingerprints": ["$FP"]
            }
          }]
          JSON
          echo "Signing key SHA-256: $FP"

      - uses: actions/upload-artifact@v4
        with:
          name: rex-comicsverse-apk
          path: |
            ${{ runner.temp }}/rex-comicsverse.apk
            ${{ runner.temp }}/assetlinks.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: Rex Comicsverse Android v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Android app for https://rexraja89-oss.github.io/rexcomicsverse/

            **Install:** download `rex-comicsverse.apk` on your phone, open it, and allow "Install unknown apps" when asked.
          files: |
            ${{ runner.temp }}/rex-comicsverse.apk
            ${{ runner.temp }}/assetlinks.json
