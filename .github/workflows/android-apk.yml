name: Build Android APK

# Same release flow as XARVIS: every build is tested, signed with the one permanent key and
# numbered 1.0.<run>; builds on main are published as the "latest" GitHub release, which the
# app itself checks for updates (app-update.js). Site-only changes don't need a new APK: the
# app shows the live website, so they reach readers without an update.
on:
  push:
    paths:
      - 'android-app/**'
      - 'tests/**'
      - 'app-update.js'
      - '.github/workflows/android-apk.yml'
      - '.github/signing-cert-sha256.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish each main build as a GitHub release (a direct APK download)
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - uses: gradle/actions/setup-gradle@v4

    - name: Unit tests (update checker)
      run: node --test tests/*.test.js

    - name: Set up the permanent signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PERMANENT_KEY=1" >> "$GITHUB_ENV"
        else
          echo "::warning title=No permanent signing key::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets aren't set, so this APK is signed with a throwaway key and can't install as an update. It won't be published."
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias rexcomics \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" \
            -dname "CN=Rex Comicsverse, O=Rex Comicsverse, C=IN"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
        fi
        echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
        echo "KEY_ALIAS=rexcomics" >> "$GITHUB_ENV"

    - name: Build signed APK
      working-directory: android-app
      env:
        BUILD_NUMBER: ${{ github.run_number }}
      run: |
        set -o pipefail
        chmod +x gradlew
        ./gradlew --no-daemon assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

    - name: Check the APK is signed with the permanent key
      run: |
        apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
        actual=$("$apksigner" verify --print-certs android-app/app/build/outputs/apk/release/app-release.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
        expected=$(cat .github/signing-cert-sha256.txt)
        echo "::notice title=Signing certificate::$actual"
        echo "CERT_SHA256=$actual" >> "$GITHUB_ENV"
        if [ -n "$PERMANENT_KEY" ] && [ "$actual" != "$expected" ]; then
          echo "::error title=Wrong signing key::APK is signed with $actual, expected $expected"
          exit 1
        fi

    - name: Report build errors
      if: failure()
      # Surfaces compiler and test errors as an annotation, readable without opening the raw log.
      run: |
        [ -f build.log ] || exit 0
        msg=$(grep -E "^e: |error:|What went wrong| FAILED$" -A3 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
        echo "::error title=Build errors::${msg}"

    # A new file name for each version, plus RexComicsverse.apk that always means "newest".
    - name: Name the APK after its version
      run: |
        mkdir -p out
        cp android-app/app/build/outputs/apk/release/app-release.apk "out/RexComicsverse-v$VERSION.apk"
        cp "out/RexComicsverse-v$VERSION.apk" out/RexComicsverse.apk
        cat > out/assetlinks.json <<JSON
        [{
          "relation": ["delegate_permission/common.handle_all_urls"],
          "target": {
            "namespace": "android_app",
            "package_name": "com.rexcomicsverse.app",
            "sha256_cert_fingerprints": ["$CERT_SHA256"]
          }
        }]
        JSON

    - uses: actions/upload-artifact@v4
      with:
        name: RexComicsverse-v${{ env.VERSION }}-apk
        path: out/*

    # A direct download, no zip and no GitHub sign-in. The app and the website link to
    # releases/latest/download/RexComicsverse.apk, which always points at the newest build.
    - name: Publish as a release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -z "$PERMANENT_KEY" ]; then
          echo "::error title=Not published::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets; an APK with a throwaway key can't update installed apps."
          exit 1
        fi
        cd out
        gh release create "v$VERSION" "RexComicsverse-v$VERSION.apk" RexComicsverse.apk assetlinks.json \
          --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Rex Comicsverse v$VERSION" --latest \
          --notes "Install or update: open https://github.com/${{ github.repository }}/releases/latest/download/RexComicsverse.apk in Chrome on your phone, then Open → Install/Update. Already have the app? It shows an UPDATE TO v$VERSION button by itself."
